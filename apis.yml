name: Caterwings
description: 'Caterwings was a European online catering marketplace connecting businesses with local caterers
  for office and event food ordering, surfaced in the API Evangelist network as a portfolio company of HV
  Capital. As of the July 2026 enrichment probe the brand appears to be retired: caterwings.com no longer
  serves a site (AWS S3 responds 403 AllAccessDisabled) and caterwings.de redirects to www.eatfirst.com, the
  corporate-catering platform operated by B2B Food Group of Berlin, which also runs the EatFirst and Feedr
  brands. No developer portal, API documentation, OpenAPI definition, SDK package, or GitHub organization
  could be found for Caterwings; this repo is retained as a historical network record with no live API surface.'
